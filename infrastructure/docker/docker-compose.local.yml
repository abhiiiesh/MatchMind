version: "3.8"

services:
  backend:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: matchmind-backend-local
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - LOG_LEVEL=DEBUG
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY:-}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION:-eastus2}
      - AZURE_COSMOS_ENDPOINT=${AZURE_COSMOS_ENDPOINT:-}
      - AZURE_COSMOS_KEY=${AZURE_COSMOS_KEY:-}
    volumes:
      - ../../matchmind:/app/matchmind
      - ../../data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    image: node:22-alpine
    container_name: matchmind-frontend-local
    working_dir: /app
    volumes:
      - ../../frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend
