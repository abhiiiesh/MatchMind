[project]
name = "matchmind"
version = "0.1.0"
description = "Multi-Agent Explainable Football Intelligence Platform for Microsoft Premier League Hackathon"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "MatchMind Team" }
]
dependencies = [
    "statsbombpy>=1.12.0",
    "kloppy>=3.15.0",
    "socceraction>=1.5.0",
    "mplsoccer>=1.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "openai>=1.40.0",
    "azure-cosmos>=4.7.0",
    "azure-identity>=1.17.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
